services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ./clips:/app/clips:ro        # background video clips (read-only)
      - ./outputs:/app/outputs       # temp render outputs
      - remotion-cache:/root/.remotion  # cache Remotion's chrome-headless-shell download

volumes:
  remotion-cache:
